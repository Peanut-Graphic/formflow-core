name: PHP Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: php-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium
          coverage: none
      - name: Validate runtime declarations
        run: |
          composer validate --strict
          php scripts/verify-runtime-contract.php
          php tests/runtime-contract.php
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP source
        run: find src tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: vendor/bin/phpunit
      - name: Audit locked dependencies
        run: composer audit --locked
